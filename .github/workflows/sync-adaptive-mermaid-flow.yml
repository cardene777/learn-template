name: Sync adaptive Mermaid flow

on:
  push:
    branches:
      - sync/adaptive-mermaid-flow
    paths:
      - ".github/workflows/sync-adaptive-mermaid-flow.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: sync/adaptive-mermaid-flow
          fetch-depth: 0
      - name: Download verified distribution artifact
        run: |
          curl -fL 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-53a0-820b-80a6-02ce44705e67/raw?se=2026-09-02T07%3A32%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=8babe6ed-837f-50be-93e1-9ee23fecdbf2&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T00%3A14%3A20Z&ske=2026-09-03T00%3A14%3A20Z&sks=b&skv=2026-02-06&sig=YFcbU/Q5SbzgIRvd9KYu%2BIU81BwsVfnHsFkhaIBsNeg%3D' -o /tmp/template.zip
          rm -rf /tmp/template-dist
          mkdir -p /tmp/template-dist
          unzip -q /tmp/template.zip -d /tmp/template-dist
      - name: Apply exact adaptive renderer
        run: |
          cp /tmp/template-dist/src/scripts/article-runtime.js src/scripts/article-runtime.js
          grep -q 'reflowWideFlowchart' src/scripts/article-runtime.js
          grep -q "box.dataset.layoutMode='reflow'" src/scripts/article-runtime.js
          grep -q '__LEARN_REPOSITORY__' src/scripts/article-runtime.js
      - name: Build public template
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit renderer
        run: |
          git config user.name cardene
          git config user.email 61857866+cardene777@users.noreply.github.com
          git add src/scripts/article-runtime.js
          git commit -m 'fix: adapt wide Mermaid flowcharts to article width [skip ci]'
          git push origin HEAD:sync/adaptive-mermaid-flow
