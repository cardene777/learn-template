name: Apply Blueprint Mermaid renderer v2

on:
  push:
    branches:
      - sync/mermaid-blueprint-v2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: sync/mermaid-blueprint-v2
          fetch-depth: 0
      - name: Apply renderer v2
        run: python3 .github/patch_mermaid_blueprint_v2.py
      - name: Verify Blueprint v2 source
        run: |
          grep -q "applyMermaidBlueprint" src/scripts/article-runtime.js
          grep -q "FLOWCHART:14" src/scripts/article-runtime.js
          grep -q "CLASS:13" src/scripts/article-runtime.js
          grep -q "STATE:16" src/scripts/article-runtime.js
          grep -q "Mermaid Blueprint renderer v2" assets/article-overrides.css
          grep -q "radial-gradient" assets/article-overrides.css
      - name: Build public template
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit renderer v2
        run: |
          git config user.name cardene
          git config user.email 61857866+cardene777@users.noreply.github.com
          git add src/scripts/article-runtime.js assets/article-overrides.css
          git commit -m "fix: sync post-render Blueprint Mermaid styling [skip ci]"
          git push origin HEAD:sync/mermaid-blueprint-v2
