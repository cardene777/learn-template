name: Sync Mermaid wide-flow v4

on:
  push:
    branches:
      - sync/mermaid-wide-flow-v4
    paths:
      - ".github/workflows/sync-mermaid-wide-flow-v4.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: sync/mermaid-wide-flow-v4
          fetch-depth: 0
      - name: Download sanitized distribution artifact
        run: |
          curl -fL 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-f7ec-81fa-9cd0-e2f151beeb8d/raw?se=2026-09-02T05%3A16%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=57a01e23-5ccb-55bd-8897-3c55831a4209&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T23%3A29%3A02Z&ske=2026-09-02T23%3A29%3A02Z&sks=b&skv=2026-02-06&sig=ARMlQK2SzYW5ozJfCfoKeUhajm5sIpAFbhUylWMe998%3D' -o /tmp/template.zip
          rm -rf /tmp/template-dist
          mkdir -p /tmp/template-dist
          unzip -q /tmp/template.zip -d /tmp/template-dist
      - name: Apply exact renderer files
        run: |
          cp /tmp/template-dist/src/scripts/article-runtime.js src/scripts/article-runtime.js
          cp /tmp/template-dist/assets/article-overrides.css assets/article-overrides.css
          grep -q "FLOWCHART:{radius:16}" src/scripts/article-runtime.js
          ! grep -q "FLOWCHART:{radius:16,badge:'NODE'}" src/scripts/article-runtime.js
          grep -q "stabilizeMermaidLayout" src/scripts/article-runtime.js
          grep -q "mermaid-svg-readable-wide" assets/article-overrides.css
          grep -q "Mermaid wide-flow readability v4" assets/article-overrides.css
          grep -q '__LEARN_REPOSITORY__' src/scripts/article-runtime.js
      - name: Build public template
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit exact renderer
        run: |
          git config user.name cardene
          git config user.email 61857866+cardene777@users.noreply.github.com
          git add src/scripts/article-runtime.js assets/article-overrides.css
          git commit -m 'fix: preserve readable wide Mermaid flowcharts [skip ci]'
          git push origin HEAD:sync/mermaid-wide-flow-v4
