name: Sync Blueprint v3

on:
  push:
    branches:
      - sync/mermaid-blueprint-v3
    paths:
      - ".github/workflows/sync-blueprint-v3.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: sync/mermaid-blueprint-v3
          fetch-depth: 0
      - name: Download sanitized distribution artifact
        run: |
          curl -fL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-3b44-81fb-b4a4-c79a1207fcbe/raw?se=2026-09-02T04%3A48%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=135f17fd-75b6-5936-9bd5-3a458a274c6f&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T01%3A55%3A22Z&ske=2026-09-03T01%3A55%3A22Z&sks=b&skv=2026-02-06&sig=gOqumOrdBeGNEorFTGo2L3O5ELfmWkBvj39Tax1VmOM%3D' -o /tmp/learn-template.zip
          rm -rf /tmp/learn-template-dist
          mkdir -p /tmp/learn-template-dist
          unzip -q /tmp/learn-template.zip -d /tmp/learn-template-dist
      - name: Apply exact Blueprint v3 renderer
        run: |
          cp /tmp/learn-template-dist/src/scripts/article-runtime.js src/scripts/article-runtime.js
          cp /tmp/learn-template-dist/assets/article-overrides.css assets/article-overrides.css
          grep -q 'mermaid@11.17.2' src/scripts/article-runtime.js
          grep -q "SWIMLANE" src/scripts/article-runtime.js
          grep -q "dataset.learnBlueprint='3'" src/scripts/article-runtime.js
          grep -q 'Mermaid Blueprint viewer v3' assets/article-overrides.css
          grep -q '#bfd8dd' assets/article-overrides.css
          grep -q '__LEARN_REPOSITORY__' src/scripts/article-runtime.js
      - name: Build public template
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit exact renderer
        run: |
          git config user.name cardene
          git config user.email 61857866+cardene777@users.noreply.github.com
          git add src/scripts/article-runtime.js assets/article-overrides.css
          git commit -m 'feat: sync Golden A Blueprint Mermaid renderer [skip ci]'
          git push origin HEAD:sync/mermaid-blueprint-v3
