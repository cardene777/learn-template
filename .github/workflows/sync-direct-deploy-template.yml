name: Sync direct-deploy Learn template

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-direct-deploy-template.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout template repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Download verified sanitized export
        run: |
          curl --fail --location --retry 3 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-af5c-820b-855b-3636aadc22c9/raw?se=2026-09-01T23%3A23%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=1fd3915d-49cd-5e5a-acd1-b1a3499568d0&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T21%3A38%3A26Z&ske=2026-09-02T21%3A38%3A26Z&sks=b&skv=2026-02-06&sig=8%2B0rtWQ0konhkVOFQk%2BiLzcEi33klK4UB/WPplXLEXM%3D' -o /tmp/sanitized-learn-template.zip
          echo '99cc0ccf2c32ce2ef472d477eda38f68ff642b7aa63329107d4787d1561f185c  /tmp/sanitized-learn-template.zip' | sha256sum --check

      - name: Replace repository with direct-deploy template
        run: |
          cp .github/workflows/deploy-cloudflare.yml /tmp/deploy-cloudflare.yml
          cp .github/workflows/sync-direct-deploy-template.yml /tmp/sync-direct-deploy-template.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/sanitized-learn-template.zip -d .
          mkdir -p .github/workflows
          cp /tmp/deploy-cloudflare.yml .github/workflows/deploy-cloudflare.yml
          cp /tmp/sync-direct-deploy-template.yml .github/workflows/sync-direct-deploy-template.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: add direct Wrangler deployment flow"
          git push origin HEAD:main
