<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOC Section Grid 9</title><style>:root{--bg:#e9e5db;--paper:#f3efe6;--ink:#151515;--muted:#5f6570;--line:#cfc7b8;--gold:#a67804}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif}
.wrap{max-width:1180px;margin:0 auto 24px;background:#f8f4ec;border:1px solid #cfc7b8;padding:14px;box-shadow:0 16px 40px rgba(43,36,24,.14)}
.slide{display:block;width:100%;height:auto;background:var(--paper);border:1px solid #cfc7b8}</style></head>
<body><div class="wrap">
<svg class="slide" viewBox="0 0 1600 900" role="img" aria-label="9項目目次グリッド">
  <style>
    .headerLeft{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:18px;font-weight:850;fill:#151515;letter-spacing:.10em}
    .headerRight{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:17px;font-weight:750;fill:#8a857b;letter-spacing:.10em}
    .smallNo{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:22px;font-weight:850;fill:#a67804;letter-spacing:.22em}
    .smallLabel{font-size:22px;font-weight:850;fill:#5f6570;letter-spacing:.16em}
    .title{font-size:78px;font-weight:950;fill:#070707;letter-spacing:-.055em}
    .itemMeta{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:18px;font-weight:850;fill:#a67804;letter-spacing:.13em}
    .itemTitle{font-size:28px;font-weight:900;fill:#070707;letter-spacing:-.035em}
    .desc{font-size:19px;font-weight:620;fill:#5f6570;letter-spacing:-.02em}
  </style>
  <rect width="1600" height="900" fill="#f3efe6"/>
  <text x="80" y="72" class="headerLeft">00 ／ 目次</text>
  <text x="1520" y="72" class="headerRight" text-anchor="end">02 / 20</text>
  <line x1="80" y1="100" x2="1520" y2="100" stroke="#bdb4a5" stroke-width="1"/>
  <text x="80" y="180" class="smallNo">00</text>
  <text x="132" y="180" class="smallLabel">目次</text>
  <text x="80" y="265" class="title">目次</text>
  <g><text x="80" y="340" class="itemMeta">01 ／ 03–04</text><text x="80" y="383" class="itemTitle">背景</text><text x="80" y="424" class="desc">AP2が必要になる前提。</text></g>
  <g><text x="585" y="340" class="itemMeta">02 ／ 05–06</text><text x="585" y="383" class="itemTitle">基本構造</text><text x="585" y="424" class="desc">MandateとCredentialの役割。</text></g>
  <g><text x="1090" y="340" class="itemMeta">03 ／ 07–08</text><text x="1090" y="383" class="itemTitle">登場人物</text><text x="1090" y="424" class="desc">User、Agent、Merchant、Issuer。</text></g>
  <g><text x="80" y="510" class="itemMeta">04 ／ 09–10</text><text x="80" y="553" class="itemTitle">Human Present</text><text x="80" y="594" class="desc">人がいる支払いの流れ。</text></g>
  <g><text x="585" y="510" class="itemMeta">05 ／ 11–12</text><text x="585" y="553" class="itemTitle">Human Not Present</text><text x="585" y="594" class="desc">委任された支払いの流れ。</text></g>
  <g><text x="1090" y="510" class="itemMeta">06 ／ 13–14</text><text x="1090" y="553" class="itemTitle">署名と検証</text><text x="1090" y="594" class="desc">改ざんできない拘束関係。</text></g>
  <g><text x="80" y="680" class="itemMeta">07 ／ 15–16</text><text x="80" y="723" class="itemTitle">決済連携</text><text x="80" y="764" class="desc">既存Payment Railとの接続。</text></g>
  <g><text x="585" y="680" class="itemMeta">08 ／ 17–18</text><text x="585" y="723" class="itemTitle">実装論点</text><text x="585" y="764" class="desc">WalletとAgentの責務分離。</text></g>
  <g><text x="1090" y="680" class="itemMeta">09 ／ 19–20</text><text x="1090" y="723" class="itemTitle">まとめ</text><text x="1090" y="764" class="desc">導入時の判断ポイント。</text></g>
</svg></div></body></html>
