<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Section Divider</title><style>:root{--bg:#e9e5db;--paper:#f3efe6;--ink:#151515;--muted:#5f6570;--line:#cfc7b8;--gold:#a67804;--gold-soft:#d9c795}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif}
.wrap{max-width:1180px;margin:0 auto;background:#f8f4ec;border:1px solid #cfc7b8;padding:14px;box-shadow:0 16px 40px rgba(43,36,24,.14)}
.slide{display:block;width:100%;height:auto;background:var(--paper);border:1px solid #cfc7b8}</style></head>
<body>
<div class="wrap">
<svg class="slide" viewBox="0 0 1600 900" role="img" aria-label="章扉">
  <style>
    .headerLeft{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:18px;font-weight:850;fill:#151515;letter-spacing:.10em}
    .headerRight{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:17px;font-weight:750;fill:#8a857b;letter-spacing:.10em}
    .lead{font-size:28px;font-weight:650;fill:#151515;letter-spacing:-.02em}
    .muted{font-size:21px;font-weight:650;fill:#5f6570;letter-spacing:-.01em}
  </style>
  <rect width="1600" height="900" fill="#f3efe6"/>
  <text x="80" y="72" class="headerLeft">03 ／ 提案アーキテクチャ</text>
  <text x="1520" y="72" class="headerRight" text-anchor="end">11 / 20</text>
  <line x1="80" y1="100" x2="1520" y2="100" stroke="#bdb4a5" stroke-width="1"/>

  <foreignObject x="80" y="282" width="360" height="58">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:38px;font-weight:900;letter-spacing:.22em;line-height:1;color:#a67804;white-space:nowrap;">
      <span style="display:inline-block;background:#d9c795;padding:0;">03</span>
    </div>
  </foreignObject>

  <foreignObject x="80" y="350" width="1440" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Yu Gothic UI','Yu Gothic','Noto Sans JP',sans-serif;font-size:92px;font-weight:950;letter-spacing:-0.060em;line-height:1.05;color:#070707;white-space:nowrap;">
      <span style="display:inline;background:linear-gradient(to bottom, transparent 54%, rgba(217,199,149,.86) 54%, rgba(217,199,149,.86) 88%, transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;">提案アーキテクチャ</span>
    </div>
  </foreignObject>

  <text x="80" y="590" class="lead">Signing Gatewayを追加し署名経路を1つに集約する。</text>
  <text x="80" y="634" class="muted">以降では境界と責務と検証順序を整理する。</text>
</svg>
</div>
</body>
</html>
