<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cover Left Title</title>
<style>:root{--bg:#e9e5db;--paper:#f3efe6;--ink:#151515;--muted:#5f6570;--gold:#a67804}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif}
.wrap{max-width:1180px;margin:0 auto;background:#f8f4ec;border:1px solid #cfc7b8;padding:14px;box-shadow:0 16px 40px rgba(43,36,24,.14)}
.slide{display:block;width:100%;height:auto;background:var(--paper);border:1px solid #cfc7b8}</style>
</head>
<body>
<div class="wrap">
<svg class="slide" viewBox="0 0 1600 900" role="img" aria-label="左寄せ表紙">
  <style>
    .topRight{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:18px;font-weight:750;fill:#5f6570;letter-spacing:.20em}
    .titleBlack{font-size:98px;font-weight:950;fill:#070707;letter-spacing:-.055em}
    .titleGold{font-size:98px;font-weight:950;fill:#a67804;letter-spacing:-.055em}
    .body{font-size:29px;font-weight:650;fill:#151515;letter-spacing:-.02em}
  </style>
  <rect width="1600" height="900" fill="#f3efe6"/>
  <text x="1520" y="76" class="topRight" text-anchor="end">{ページ番号} ／ {総ページ数}</text>
  <text x="80" y="335" class="titleBlack">{タイトル上段}</text>
  <text x="80" y="455" class="titleGold">{タイトル下段}</text>
  <line x1="80" y1="525" x2="180" y2="525" stroke="#151515" stroke-width="1.4"/>
  <text x="80" y="618" class="body">{説明文1}</text>
  <text x="80" y="662" class="body">{説明文2}</text>
</svg>
</div>
</body>
</html>
