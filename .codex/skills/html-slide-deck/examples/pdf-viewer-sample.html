<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>PDF Viewer Sample</title>
<style>
:root{--bg:#e9e5db;--sidebar-bg:#eee9df;--paper:#f3efe6;--ink:#151515;--muted:#746e63;--line:#cfc7b8;--accent:#1f6b55;--side:188px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;overflow-y:auto;overflow-x:hidden;-webkit-text-size-adjust:100%}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:20;overflow-y:auto;overflow-x:hidden;padding:18px 14px 28px;background:var(--sidebar-bg);border-right:1px solid var(--line);-webkit-overflow-scrolling:touch}.deck-label{position:sticky;top:-18px;z-index:2;margin:-18px -14px 16px;padding:18px 14px 14px;background:var(--sidebar-bg);border-bottom:1px solid var(--line)}.deck-title{margin:0;font-size:18px;line-height:1.18;letter-spacing:.04em;font-weight:800}.deck-count{margin:9px 0 0;color:var(--muted);font-size:14px;font-weight:700}.thumbs{display:flex;flex-direction:column;gap:22px}.thumb{display:block;color:inherit;text-decoration:none;outline:none}.thumb-number{display:block;margin:0 0 8px 5px;color:var(--muted);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}.thumb-frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--paper);border:2px solid transparent;box-shadow:0 2px 8px rgba(40,32,20,.18);transition:border-color .12s ease,box-shadow .12s ease}.thumb:focus-visible .thumb-frame,.thumb:hover .thumb-frame{border-color:rgba(31,107,85,.45)}.thumb[aria-current="page"] .thumb-frame,.thumb.is-active .thumb-frame{border-color:var(--accent);box-shadow:0 0 0 2px rgba(31,107,85,.18),0 4px 14px rgba(31,107,85,.22)}.thumb svg{display:block;width:100%;height:100%;background:var(--paper)}.doc{margin-left:var(--side);padding:24px 26px 70px}.page{scroll-margin-top:18px;margin:0 auto 30px;max-width:1060px}.page-head{display:flex;justify-content:space-between;gap:16px;margin:0 4px 10px;color:var(--muted);font-size:18px;line-height:1.2}.page-title{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.page-no{font-variant-numeric:tabular-nums}.page-card{background:var(--paper);border:1px solid var(--line);box-shadow:0 16px 34px rgba(50,42,30,.18)}.page-card svg{display:block;width:100%;height:auto;background:var(--paper)}@media(max-width:720px){:root{--side:104px}.sidebar{padding:14px 9px 24px}.deck-label{margin:-14px -9px 13px;padding:14px 9px 12px}.deck-title{font-size:13px;line-height:1.22}.deck-count{font-size:12px;margin-top:7px}.thumbs{gap:19px}.thumb-number{margin-left:4px;margin-bottom:7px;font-size:15px}.doc{padding:18px 12px 56px}.page{margin-bottom:28px;scroll-margin-top:12px}.page-head{margin:0 3px 8px;font-size:15px}}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar" aria-label="スライドサムネイル">
  <div class="deck-label"><h1 class="deck-title">PDF Viewer Sample</h1><p class="deck-count">3 pages</p></div>
  <nav class="thumbs" aria-label="ページ移動">
    <a class="thumb" href="#page-01"><span class="thumb-number">01</span><span class="thumb-frame"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3efe6"/><text x="110" y="155" font-size="46" font-weight="800">Cover</text><rect x="110" y="230" width="620" height="240" fill="#d7e4da" stroke="#1f6b55"/><rect x="800" y="230" width="620" height="240" fill="#fff" stroke="#cfc7b8"/></svg></span></a>
    <a class="thumb" href="#page-02"><span class="thumb-number">02</span><span class="thumb-frame"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3efe6"/><text x="110" y="140" font-size="42" font-weight="800">Architecture</text><rect x="115" y="260" width="360" height="190" fill="#fff" stroke="#cfc7b8"/><rect x="620" y="260" width="360" height="190" fill="#d7e4da" stroke="#1f6b55"/><rect x="1125" y="260" width="360" height="190" fill="#fff" stroke="#cfc7b8"/></svg></span></a>
    <a class="thumb" href="#page-03"><span class="thumb-number">03</span><span class="thumb-frame"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3efe6"/><text x="110" y="140" font-size="42" font-weight="800">Flow</text><rect x="110" y="260" width="300" height="220" fill="#fff" stroke="#cfc7b8"/><rect x="500" y="260" width="300" height="220" fill="#fff" stroke="#cfc7b8"/><rect x="890" y="260" width="300" height="220" fill="#d7e4da" stroke="#1f6b55"/><rect x="1280" y="260" width="210" height="220" fill="#fff" stroke="#cfc7b8"/></svg></span></a>
  </nav>
</aside>
<main class="doc" aria-label="スライド本文">
  <section id="page-01" class="page"><div class="page-head"><span class="page-title">表紙</span><span class="page-no">01 / 03</span></div><div class="page-card"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3efe6"/><text x="110" y="120" font-size="28" fill="#746e63" font-weight="700">PDF Viewer Template</text><text x="110" y="250" font-size="78" font-weight="900">PDFをそのままHTMLへ</text><text x="110" y="330" font-size="30" fill="#746e63">左は縮小サムネイル、右はPDFページを縦スクロールで表示します。</text><rect x="110" y="430" width="600" height="260" fill="#d7e4da" stroke="#1f6b55" stroke-width="4"/><text x="155" y="560" font-size="38" font-weight="800">16:9 Page</text><rect x="790" y="430" width="600" height="260" fill="#fff" stroke="#cfc7b8" stroke-width="3"/><text x="835" y="560" font-size="38" font-weight="800">Thumbnail Nav</text></svg></div></section>
  <section id="page-02" class="page"><div class="page-head"><span class="page-title">構成</span><span class="page-no">02 / 03</span></div><div class="page-card"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3efe6"/><text x="110" y="130" font-size="58" font-weight="900">テンプレートの責務</text><text x="110" y="205" font-size="28" fill="#746e63">Viewerは固定し、内容はPDFページ画像として差し込みます。</text><rect x="110" y="300" width="360" height="220" fill="#fff" stroke="#cfc7b8" stroke-width="3"/><text x="145" y="415" font-size="34" font-weight="800">Sidebar</text><rect x="620" y="300" width="360" height="220" fill="#d7e4da" stroke="#1f6b55" stroke-width="4"/><text x="655" y="415" font-size="34" font-weight="800">Page Images</text><rect x="1130" y="300" width="360" height="220" fill="#fff" stroke="#cfc7b8" stroke-width="3"/><text x="1165" y="415" font-size="34" font-weight="800">Active State</text></svg></div></section>
  <section id="page-03" class="page"><div class="page-head"><span class="page-title">動作</span><span class="page-no">03 / 03</span></div><div class="page-card"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3efe6"/><text x="110" y="130" font-size="58" font-weight="900">サムネイルをタップして移動</text><text x="110" y="205" font-size="28" fill="#746e63">active枠は番号ではなく、サムネイル画像だけに付きます。</text><rect x="110" y="330" width="270" height="210" fill="#fff" stroke="#cfc7b8" stroke-width="3"/><text x="150" y="450" font-size="30" font-weight="800">01</text><rect x="500" y="330" width="270" height="210" fill="#fff" stroke="#cfc7b8" stroke-width="3"/><text x="540" y="450" font-size="30" font-weight="800">02</text><rect x="890" y="330" width="270" height="210" fill="#d7e4da" stroke="#1f6b55" stroke-width="5"/><text x="930" y="450" font-size="30" font-weight="800">03</text><text x="1235" y="450" font-size="34" fill="#1f6b55" font-weight="900">Active</text></svg></div></section>
</main>
<script>(function(){const thumbs=Array.from(document.querySelectorAll('.thumb'));const pages=Array.from(document.querySelectorAll('.page'));const sidebar=document.getElementById('sidebar');let lockUntil=0;function setActive(id,syncSide){thumbs.forEach((thumb)=>{const active=thumb.getAttribute('href')==='#'+id;thumb.classList.toggle('is-active',active);if(active)thumb.setAttribute('aria-current','page');else thumb.removeAttribute('aria-current')});if(syncSide){const target=thumbs.find((thumb)=>thumb.getAttribute('href')==='#'+id);if(target&&sidebar){const top=target.offsetTop-sidebar.clientHeight*.28;sidebar.scrollTo({top:Math.max(0,top),behavior:'smooth'})}}}thumbs.forEach((thumb)=>{thumb.addEventListener('click',(event)=>{const id=thumb.getAttribute('href').slice(1);const page=document.getElementById(id);if(!page)return;event.preventDefault();lockUntil=Date.now()+700;setActive(id,true);history.replaceState(null,'','#'+id);const y=page.getBoundingClientRect().top+window.pageYOffset-12;window.scrollTo({top:Math.max(0,y),behavior:'smooth'})})});if('IntersectionObserver'in window){const observer=new IntersectionObserver((entries)=>{if(Date.now()<lockUntil)return;const visible=entries.filter((entry)=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible)setActive(visible.target.id,true)},{threshold:[.25,.45,.65],rootMargin:'-10% 0px -45% 0px'});pages.forEach((page)=>observer.observe(page))}const initial=location.hash?location.hash.slice(1):(pages[0]&&pages[0].id);if(initial)setActive(initial,true)})();</script>
</body>
</html>
