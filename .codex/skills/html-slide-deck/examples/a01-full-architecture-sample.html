<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A01 OWS Reference Style Full Architecture</title>
<style>
  html,body{margin:0;background:#e9e5db;font-family:"Noto Sans CJK JP","Noto Sans",sans-serif;color:#151515}
  .wrap{max-width:1180px;margin:24px auto;padding:14px;background:#f8f4ec;border:1px solid #cfc7b8;box-shadow:0 14px 36px rgba(43,36,24,.14)}
  svg{display:block;width:100%;height:auto;background:#f3efe6;border:1px solid #cfc7b8}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1600 900" role="img" aria-label="A01 OWS参照準拠 全体アーキテクチャ図">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#d7d0c4" stroke-width="1" opacity="0.45"/>
  </pattern>
  <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#151515"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6b55"/></marker>
</defs>
<style>
  .meta{font-family:monospace;font-size:17px;font-weight:800;fill:#151515;letter-spacing:.08em}
  .topno{font-family:monospace;font-size:18px;font-weight:700;fill:#8a857b;letter-spacing:.12em}
  .sectionNo{font-family:monospace;font-size:20px;font-weight:900;fill:#b58a2a;letter-spacing:.16em}
  .sectionText{font-family:"Noto Sans CJK JP","Noto Sans",sans-serif;font-size:22px;font-weight:800;fill:#737067;letter-spacing:.16em}
  .title{font-family:"Noto Sans CJK JP","Noto Sans",sans-serif;font-size:58px;font-weight:900;fill:#151515;letter-spacing:-.05em}
  .lead{font-family:"Noto Sans CJK JP","Noto Sans",sans-serif;font-size:24px;font-weight:600;fill:#26231f}
  .zoneLabel{font-family:monospace;font-size:18px;font-weight:900;letter-spacing:.14em;text-anchor:middle}
  .nodeTitle{font-family:"Noto Sans CJK JP","Noto Sans",sans-serif;font-size:24px;font-weight:900;fill:#151515;text-anchor:middle}
  .footer{font-family:monospace;font-size:16px;font-weight:700;fill:#8a857b;letter-spacing:.08em}
  .box{fill:#fdfaf4;stroke:#151515;stroke-width:2.2}
  .redBox{stroke:#a6402d}.goldBox{stroke:#b58a2a}.greenBox{stroke:#1f6b55}
  .arrow{stroke:#151515;stroke-width:4;fill:none;marker-end:url(#arrowBlack)}
  .arrowGreen{stroke:#1f6b55;stroke-width:4;fill:none;marker-end:url(#arrowGreen)}
</style>
<rect width="1600" height="900" fill="#f3efe6"/>
<text x="80" y="78" class="meta">● OWS 図解パターンテンプレート</text>
<text x="1520" y="78" class="topno" text-anchor="end">{章番号} ／ {ページ番号} of {総ページ数}</text>
<line x1="80" y1="100" x2="1520" y2="100" stroke="#bdb4a5" stroke-width="1"/>
<text x="80" y="158" class="sectionNo">A01</text>
<text x="150" y="158" class="sectionText">図解パターン</text>
<text x="80" y="226" class="title">{タイトル}</text>
<text x="80" y="282" class="lead">{この図の要点を説明するリード文}</text>
<text x="280" y="338" class="zoneLabel" fill="#a6402d">UNTRUSTED ／ {外部}</text>
<text x="810" y="338" class="zoneLabel" fill="#b58a2a">{中核システム}</text>
<text x="1335" y="338" class="zoneLabel" fill="#1f6b55">{安全境界}</text>
<rect x="115" y="360" width="340" height="420" fill="url(#hatch)" stroke="#a6402d" stroke-width="1.7" stroke-dasharray="7 6"/>
<rect x="505" y="360" width="610" height="420" fill="url(#hatch)" stroke="#b58a2a" stroke-width="1.9"/>
<rect x="1165" y="360" width="330" height="420" fill="url(#hatch)" stroke="#1f6b55" stroke-width="1.7" stroke-dasharray="7 6"/>
<rect x="165" y="420" width="235" height="132" class="box redBox"/><text x="282.5" y="497" class="nodeTitle">{Actor A}</text>
<rect x="165" y="625" width="235" height="132" class="box redBox"/><text x="282.5" y="702" class="nodeTitle">{Actor B}</text>
<rect x="550" y="420" width="255" height="132" class="box goldBox"/><text x="677.5" y="497" class="nodeTitle">{入口}</text>
<rect x="875" y="420" width="255" height="132" class="box goldBox"/><text x="1002.5" y="497" class="nodeTitle">{確認}</text>
<rect x="550" y="625" width="255" height="132" class="box goldBox"/><text x="677.5" y="702" class="nodeTitle">{評価}</text>
<rect x="875" y="625" width="255" height="132" class="box goldBox"/><text x="1002.5" y="702" class="nodeTitle">{委譲}</text>
<rect x="1215" y="625" width="235" height="132" class="box greenBox"/><text x="1332.5" y="702" class="nodeTitle">{保護対象}</text>
<path d="M400 486 H550" class="arrow"/><path d="M400 691 H550" class="arrow"/><path d="M805 486 H875" class="arrow"/><path d="M805 691 H875" class="arrow"/><path d="M677.5 552 V625" stroke="#151515" stroke-width="3" fill="none"/><path d="M1002.5 552 V625" stroke="#151515" stroke-width="3" fill="none"/><path d="M1130 691 H1215" class="arrowGreen"/>
<line x1="80" y1="820" x2="1520" y2="820" stroke="#bdb4a5" stroke-width="1"/>
<text x="80" y="855" class="footer">{章名} ／ {ページ名}</text><text x="1520" y="855" class="footer" text-anchor="end">{ページ番号} / {総ページ数}</text>
</svg>
</div>
</body>
</html>
