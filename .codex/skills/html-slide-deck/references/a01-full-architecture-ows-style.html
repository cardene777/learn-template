<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A01 OWS参照準拠テンプレート 整理版</title>
<style>
:root{
  --paper:#f3efe6;
  --ink:#151515;
  --muted:#7a756a;
  --line:#cfc7b8;
  --gold:#a98321;
  --gold-soft:#efe2bd;
  --green:#1f6b55;
  --green-soft:#d7e4da;
  --red:#a6402d;
  --red-soft:#ead2ca;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e5db;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:24px}
.card{background:#f8f4ec;border:1px solid var(--line);padding:14px;box-shadow:0 16px 42px rgba(43,36,24,.15)}
svg{display:block;width:100%;height:auto;background:var(--paper)}
.meta{font-size:25px;font-weight:800;letter-spacing:.06em;fill:var(--ink)}
.page-meta{font-size:24px;font-weight:700;fill:#9a968e;letter-spacing:.08em}
.section{font-size:25px;font-weight:900;letter-spacing:.22em;fill:var(--gold)}
.section-sub{font-size:23px;font-weight:800;letter-spacing:.06em;fill:var(--muted)}
.title{font-size:72px;font-weight:900;letter-spacing:-.04em;fill:var(--ink)}
.lead{font-size:32px;font-weight:560;fill:var(--ink)}
.region-label{font-size:18px;font-weight:900;letter-spacing:.14em;text-anchor:middle}
.zone-title{font-size:26px;font-weight:900;fill:var(--gold)}
.zone-sub{font-size:18px;font-weight:600;fill:var(--muted)}
.module-label{font-size:18px;font-weight:900;letter-spacing:.1em;fill:var(--gold)}
.module-label-green{font-size:18px;font-weight:900;letter-spacing:.1em;fill:var(--green)}
.module-title{font-size:31px;font-weight:900;fill:var(--ink)}
.module-desc{font-size:18px;font-weight:600;fill:var(--muted)}
.actor-title{font-size:31px;font-weight:900;fill:var(--ink)}
.actor-desc{font-size:18px;font-weight:600;fill:var(--muted)}
.footer{font-size:18px;font-weight:700;fill:#9a968e;letter-spacing:.04em}
.legend-label{font-size:18px;font-weight:900;letter-spacing:.1em}
.legend-desc{font-size:18px;font-weight:600;fill:var(--muted)}
.node{fill:#f8f5ed;stroke:#151515;stroke-width:2.2}
.node-red{fill:#f8f5ed;stroke:var(--red);stroke-width:2.3}
.node-gold{fill:#f8f5ed;stroke:var(--gold);stroke-width:2.3}
.node-green{fill:#f8f5ed;stroke:var(--green);stroke-width:2.3}
.zone-dash{fill:url(#hatch-neutral);stroke:#8f8a80;stroke-width:1.8;stroke-dasharray:5 6}
.zone-red{fill:url(#hatch-red);stroke:var(--red);stroke-width:1.8;stroke-dasharray:7 5}
.zone-gold{fill:url(#hatch-gold);stroke:var(--gold);stroke-width:2.3}
.zone-green{fill:url(#hatch-green);stroke:var(--green);stroke-width:2.3}
.arrow{stroke:var(--ink);stroke-width:4;fill:none;marker-end:url(#arrow-black)}
.arrow-green{stroke:var(--green);stroke-width:4;fill:none;marker-end:url(#arrow-green)}
.arrow-label{font-size:17px;font-weight:900;letter-spacing:.08em;fill:#4f4b43}
.arrow-label-green{font-size:17px;font-weight:900;letter-spacing:.08em;fill:var(--green)}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<svg viewBox="0 0 2520 1418" role="img" aria-label="A01 OWS参照準拠テンプレート整理版">
<defs>
  <pattern id="hatch-neutral" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="#f7f3eb"/>
    <line x1="0" y1="0" x2="0" y2="14" stroke="#ded6c8" stroke-width="1" opacity=".42"/>
  </pattern>
  <pattern id="hatch-red" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="#f7f3eb"/>
    <line x1="0" y1="0" x2="0" y2="14" stroke="#e6c9c0" stroke-width="1" opacity=".62"/>
  </pattern>
  <pattern id="hatch-gold" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="#f7f3eb"/>
    <line x1="0" y1="0" x2="0" y2="14" stroke="#e4d7b3" stroke-width="1" opacity=".62"/>
  </pattern>
  <pattern id="hatch-green" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="#f7f3eb"/>
    <line x1="0" y1="0" x2="0" y2="14" stroke="#cfdfd2" stroke-width="1" opacity=".72"/>
  </pattern>
  <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#151515"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6b55"/></marker>
</defs>

<rect width="2520" height="1418" fill="#f3efe6"/>
<circle cx="126" cy="107" r="8" fill="#151515"/>
<text x="150" y="114" class="meta">{資料名}</text>
<line x1="126" y1="142" x2="2390" y2="142" stroke="#bdb6aa" stroke-width="1.2"/>
<text x="2390" y="116" class="page-meta" text-anchor="end">{章番号} ／ {ページ番号} of {総ページ数}</text>

<text x="126" y="238" class="section">0 1 . 1</text>
<text x="235" y="238" class="section-sub">{セクション}</text>
<rect x="588" y="327" width="430" height="56" fill="#decc98" opacity=".86"/>
<rect x="1070" y="327" width="520" height="56" fill="#bfd1c3" opacity=".86"/>
<text x="126" y="353" class="title">{タイトル}――{強調語A}を{強調語B}</text>
<text x="126" y="432" class="lead">{このページの要点を1〜2文で説明するリード文}</text>

<text x="405" y="548" class="region-label" fill="#a6402d">UNTRUSTED ／ {外側}</text>
<text x="1275" y="548" class="region-label" fill="#a98321">{中核システム} ／ {環境}</text>
<text x="2080" y="548" class="region-label" fill="#1f6b55">{安全境界}</text>

<rect x="218" y="584" width="2088" height="636" class="zone-dash"/>
<text x="238" y="614" class="zone-sub">{全体境界ラベル}</text>
<rect x="255" y="640" width="330" height="500" class="zone-red"/>
<rect x="635" y="640" width="1115" height="500" class="zone-gold"/>
<rect x="1800" y="640" width="480" height="500" class="zone-green"/>

<text x="665" y="680" class="zone-title">{中核システム}（{単一プロセス}）</text>
<text x="665" y="714" class="zone-sub">{この領域に置く責務の短い説明}</text>
<text x="1830" y="680" class="zone-title" fill="#1f6b55">{安全境界タイトル}</text>
<text x="1830" y="714" class="zone-sub">{境界の説明}</text>

<rect x="295" y="700" width="250" height="128" class="node-red"/>
<text x="320" y="755" class="actor-title">{Actor A}</text>
<text x="320" y="794" class="actor-desc">{短い説明}</text>
<rect x="295" y="884" width="250" height="128" class="node-red"/>
<text x="320" y="939" class="actor-title">{Actor B}</text>
<text x="320" y="978" class="actor-desc">{短い説明}</text>

<rect x="675" y="700" width="480" height="128" class="node-gold"/>
<text x="700" y="731" class="module-label">{分類ラベル}</text>
<text x="700" y="779" class="module-title">{Module A}</text>
<text x="700" y="812" class="module-desc">{短い説明}</text>
<rect x="1210" y="700" width="480" height="128" class="node-gold"/>
<text x="1235" y="731" class="module-label">{分類ラベル}</text>
<text x="1235" y="779" class="module-title">{Module B}</text>
<text x="1235" y="812" class="module-desc">{短い説明}</text>
<rect x="675" y="884" width="480" height="128" class="node-green" fill="#d7e4da"/>
<text x="700" y="915" class="module-label-green">{分類ラベル}</text>
<text x="700" y="963" class="module-title">{Module C}</text>
<text x="700" y="996" class="module-desc">{短い説明}</text>
<rect x="1210" y="884" width="480" height="128" class="node-gold"/>
<text x="1235" y="915" class="module-label">{分類ラベル}</text>
<text x="1235" y="963" class="module-title">{Module D}</text>
<text x="1235" y="996" class="module-desc">{短い説明}</text>
<rect x="675" y="1062" width="1015" height="100" class="node-green" fill="#d7e4da"/>
<text x="700" y="1095" class="module-label-green">{分類ラベル}</text>
<text x="700" y="1144" class="module-title">{横断レイヤー ／ 既存機能}</text>

<rect x="1875" y="810" width="320" height="256" class="node-green"/>
<text x="1905" y="859" class="module-label-green">{保護領域}</text>
<text x="1905" y="923" class="module-title">{保護対象}</text>
<text x="1905" y="969" class="module-desc">{補足説明}</text>

<path d="M545 764 H675" class="arrow"/>
<text x="610" y="744" class="arrow-label">{要求}</text>
<path d="M545 948 H675" class="arrow-green"/>
<text x="610" y="928" class="arrow-label-green">{要求}</text>
<path d="M1155 764 H1210" class="arrow"/>
<path d="M1155 948 H1210" class="arrow-green"/>
<path d="M915 828 V884" stroke="#a98321" stroke-width="4" fill="none" marker-end="url(#arrow-black)"/>
<path d="M1450 828 V884" stroke="#151515" stroke-width="4" fill="none" marker-end="url(#arrow-black)"/>
<path d="M1690 948 H1875" class="arrow-green"/>
<text x="1782" y="928" class="arrow-label-green">{委譲}</text>

<rect x="126" y="1254" width="745" height="64" fill="#f4ead0"/>
<line x1="126" y1="1254" x2="126" y2="1318" stroke="#a98321" stroke-width="4"/>
<text x="145" y="1278" class="legend-label" fill="#a98321">{追加要素}</text>
<text x="145" y="1306" class="legend-desc">{追加される要素の説明}</text>
<rect x="890" y="1254" width="745" height="64" fill="#e9eee8"/>
<line x1="890" y1="1254" x2="890" y2="1318" stroke="#1f6b55" stroke-width="4"/>
<text x="909" y="1278" class="legend-label" fill="#1f6b55">{既存要素}</text>
<text x="909" y="1306" class="legend-desc">{既存要素の説明}</text>
<rect x="1654" y="1254" width="735" height="64" fill="#f6f5f0"/>
<line x1="1654" y1="1254" x2="1654" y2="1318" stroke="#151515" stroke-width="4"/>
<text x="1673" y="1278" class="legend-label" fill="#151515">{外部境界}</text>
<text x="1673" y="1306" class="legend-desc">{境界外の説明}</text>

<line x1="126" y1="1340" x2="2390" y2="1340" stroke="#bdb6aa" stroke-width="1.2"/>
<text x="126" y="1380" class="footer">{章名} ／ {ページ名}</text>
<text x="2390" y="1380" class="footer" text-anchor="end">{ページ番号} / {総ページ数}</text>
</svg>
</div></div>
</body>
</html>
