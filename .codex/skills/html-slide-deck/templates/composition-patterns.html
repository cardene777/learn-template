<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OWS準拠 構成パターン一覧</title>
<style>
:root {
  --bg:#e9e5db;
  --paper:#f3efe6;
  --ink:#151515;
  --muted:#746e63;
  --line:#cfc7b8;
  --green:#1f6b55;
  --green-soft:#d7e4da;
  --gold:#b58a2a;
  --gold-soft:#efe2bd;
  --red:#a6402d;
  --red-soft:#ead2ca;
}
* { box-sizing:border-box; }
body { margin:0; padding:28px 18px 70px; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif; }
.header { max-width:1240px; margin:0 auto 26px; }
.header h1 { margin:0; font-size:28px; line-height:1.25; font-weight:850; }
.header p { margin:10px 0 0; color:var(--muted); font-size:15px; line-height:1.7; }
.grid { max-width:1240px; margin:0 auto; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; }
.pattern-card { background:#f8f4ec; border:1px solid var(--line); padding:13px; box-shadow:0 12px 30px rgba(43,36,24,.12); }
.pattern-name { display:flex; align-items:baseline; gap:10px; margin:0 0 10px; font-size:16px; font-weight:850; }
.pattern-name span { color:var(--gold); font-size:12px; letter-spacing:.16em; font-weight:900; }
.slide { display:block; width:100%; height:auto; border:1px solid var(--line); background:var(--paper); }
.top-meta { font-size:17px; fill:#746e63; font-weight:700; letter-spacing:.02em; }
.section-label { font-size:28px; fill:#151515; font-weight:850; letter-spacing:.18em; }
.title { font-size:46px; fill:#151515; font-weight:850; letter-spacing:-.035em; }
.lead { font-size:23px; fill:#37342f; font-weight:500; }
.footer { font-size:15px; fill:#746e63; font-weight:700; }
.block-label { font-size:18px; fill:#746e63; font-weight:850; letter-spacing:.14em; }
.small-note { font-size:24px; fill:#151515; font-weight:850; }
.zone, .figure-zone, .text-zone, .warn-zone { stroke-width:2; }
.figure-zone { fill:var(--green-soft); stroke:var(--green); }
.text-zone { fill:var(--gold-soft); stroke:var(--gold); }
.warn-zone { fill:var(--red-soft); stroke:var(--red); }
.zone-text { fill:#151515; font-weight:900; }
@media(max-width:800px) { body { padding:18px 10px 48px; } .grid { grid-template-columns:1fr; gap:16px; } .header h1 { font-size:22px; } }
</style>
</head>
