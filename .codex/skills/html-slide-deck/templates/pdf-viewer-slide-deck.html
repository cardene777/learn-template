<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>{{DECK_TITLE}}</title>
<style>
:root {
  --bg:#e9e5db;
  --sidebar-bg:#eee9df;
  --paper:#f3efe6;
  --ink:#151515;
  --muted:#746e63;
  --line:#cfc7b8;
  --accent:#1f6b55;
  --accent-soft:#d7e4da;
  --side:188px;
}

* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

.viewer { min-height:100vh; }
.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:var(--side);
  z-index:20;
  overflow-y:auto;
  overflow-x:hidden;
  padding:18px 14px 28px;
  background:var(--sidebar-bg);
  border-right:1px solid var(--line);
  -webkit-overflow-scrolling:touch;
}

.deck-label {
  position:sticky;
  top:-18px;
  z-index:2;
  margin:-18px -14px 16px;
  padding:18px 14px 14px;
  background:var(--sidebar-bg);
  border-bottom:1px solid var(--line);
}
.deck-title {
  margin:0;
  font-size:18px;
  line-height:1.18;
  letter-spacing:.04em;
  font-weight:800;
}
.deck-count {
  margin:9px 0 0;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}

.thumbs {
  display:flex;
  flex-direction:column;
  gap:22px;
}
.thumb {
  display:block;
  color:inherit;
  text-decoration:none;
  outline:none;
}
.thumb-number {
  display:block;
  margin:0 0 8px 5px;
  color:var(--muted);
  font-size:18px;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.thumb-frame {
  position:relative;
  aspect-ratio:16 / 9;
  overflow:hidden;
  background:var(--paper);
  border:2px solid transparent;
  box-shadow:0 2px 8px rgba(40,32,20,.18);
  transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;
}
.thumb:focus-visible .thumb-frame,
.thumb:hover .thumb-frame {
  border-color:rgba(31,107,85,.45);
}
.thumb[aria-current="page"] .thumb-frame,
.thumb.is-active .thumb-frame {
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(31,107,85,.18), 0 4px 14px rgba(31,107,85,.22);
}
.thumb img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:var(--paper);
}

.doc {
  margin-left:var(--side);
  padding:24px 26px 70px;
}
.page {
  scroll-margin-top:18px;
  margin:0 auto 30px;
  max-width:1060px;
}
.page-head {
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin:0 4px 10px;
  color:var(--muted);
  font-size:18px;
  line-height:1.2;
}
.page-title {
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.page-no { font-variant-numeric:tabular-nums; }
.page-card {
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:0 16px 34px rgba(50,42,30,.18);
}
.page-card img {
  display:block;
  width:100%;
  height:auto;
  background:var(--paper);
}

@media (max-width:720px) {
  :root { --side:104px; }
  .sidebar { padding:14px 9px 24px; }
  .deck-label { margin:-14px -9px 13px; padding:14px 9px 12px; }
  .deck-title { font-size:13px; line-height:1.22; }
  .deck-count { font-size:12px; margin-top:7px; }
  .thumbs { gap:19px; }
  .thumb-number { margin-left:4px; margin-bottom:7px; font-size:15px; }
  .doc { padding:18px 12px 56px; }
  .page { margin-bottom:28px; scroll-margin-top:12px; }
  .page-head { margin:0 3px 8px; font-size:15px; }
}
</style>
</head>
<body>
<div class="viewer">
  <aside id="sidebar" class="sidebar" aria-label="スライドサムネイル">
    <div class="deck-label">
      <h1 class="deck-title">{{DECK_TITLE}}</h1>
      <p class="deck-count">{{PAGE_COUNT}} pages</p>
    </div>
    <nav class="thumbs" aria-label="ページ移動">
{{THUMBNAILS}}
    </nav>
  </aside>

  <main class="doc" aria-label="スライド本文">
{{PAGES}}
  </main>
</div>
<script>
(function(){
  const thumbs = Array.from(document.querySelectorAll('.thumb'));
  const pages = Array.from(document.querySelectorAll('.page'));
  const sidebar = document.getElementById('sidebar');
  let lockUntil = 0;

  function setActive(id, syncSide) {
    thumbs.forEach((thumb) => {
      const active = thumb.getAttribute('href') === '#' + id;
      thumb.classList.toggle('is-active', active);
      if (active) thumb.setAttribute('aria-current','page');
      else thumb.removeAttribute('aria-current');
    });
    if (syncSide) {
      const target = thumbs.find((thumb) => thumb.getAttribute('href') === '#' + id);
      if (target && sidebar) {
        const top = target.offsetTop - sidebar.clientHeight * 0.28;
        sidebar.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    }
  }

  thumbs.forEach((thumb) => {
    thumb.addEventListener('click', (event) => {
      const id = thumb.getAttribute('href').slice(1);
      const page = document.getElementById(id);
      if (!page) return;
      event.preventDefault();
      lockUntil = Date.now() + 700;
      setActive(id, true);
      history.replaceState(null, '', '#' + id);
      const y = page.getBoundingClientRect().top + window.pageYOffset - 12;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    });
  });

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      if (Date.now() < lockUntil) return;
      const visible = entries
        .filter((entry) => entry.isIntersecting)
        .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) setActive(visible.target.id, true);
    }, { threshold:[0.25,0.45,0.65], rootMargin:'-10% 0px -45% 0px' });
    pages.forEach((page) => observer.observe(page));
  }

  const initial = location.hash ? location.hash.slice(1) : (pages[0] && pages[0].id);
  if (initial) setActive(initial, true);
})();
</script>
</body>
</html>
