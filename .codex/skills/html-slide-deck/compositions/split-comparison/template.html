<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Split Comparison Layout</title><style>:root{--bg:#e9e5db;--paper:#f3efe6;--ink:#151515;--muted:#746e63;--line:#c8bfae;--gold:#d9c795}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif}.wrap{max-width:1180px;margin:0 auto 24px;background:#f8f4ec;border:1px solid #cfc7b8;padding:14px;box-shadow:0 16px 40px rgba(43,36,24,.14)}.slide{display:block;width:100%;height:auto;background:var(--paper);border:1px solid #cfc7b8}</style></head>
<body><div class="wrap"><svg class="slide" viewBox="0 0 1600 900" role="img" aria-label="左右比較構成"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#d9d1c3" stroke-width="1" opacity="0.50"/></pattern></defs><style>.headerLeft{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:18px;font-weight:850;fill:#151515;letter-spacing:.10em}.headerRight{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:17px;font-weight:750;fill:#8a857b;letter-spacing:.10em}.title{font-size:64px;font-weight:900;fill:#151515;letter-spacing:-.055em}.lead{font-size:25px;font-weight:600;fill:#26231f}.slot{font-size:34px;font-weight:900;fill:#746e63;letter-spacing:-.02em;text-anchor:middle}.sub{font-size:20px;font-weight:650;fill:#8a857b;letter-spacing:-.02em;text-anchor:middle}</style><rect width="1600" height="900" fill="#f3efe6"/><text x="80" y="72" class="headerLeft">{章番号} ／ {セクション名}</text><text x="1520" y="72" class="headerRight" text-anchor="end">{ページ番号} / {総ページ数}</text><line x1="80" y1="100" x2="1520" y2="100" stroke="#bdb4a5" stroke-width="1"/><rect x="80" y="169" width="335" height="34" fill="#d9c795" opacity="0.86"/><text x="80" y="185" class="title">{タイトル}</text><text x="80" y="265" class="lead">{このページの要点を1〜2文で説明するリード文}</text><g id="content-region"><rect x="80" y="315" width="696" height="505" fill="url(#hatch)" stroke="#c8bfae" stroke-width="1.6" stroke-dasharray="8 7"/><rect x="104" y="339" width="648" height="457" fill="rgba(255,255,255,.20)" stroke="#d8d0c2" stroke-width="1"/><text x="428" y="570" class="slot">{比較A}</text><text x="428" y="608" class="sub">左側の比較対象</text><rect x="824" y="315" width="696" height="505" fill="url(#hatch)" stroke="#c8bfae" stroke-width="1.6" stroke-dasharray="8 7"/><rect x="848" y="339" width="648" height="457" fill="rgba(255,255,255,.20)" stroke="#d8d0c2" stroke-width="1"/><text x="1172" y="570" class="slot">{比較B}</text><text x="1172" y="608" class="sub">右側の比較対象</text></g></svg></div></body></html>
