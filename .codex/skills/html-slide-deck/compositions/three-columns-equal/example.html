<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Columns Equal</title><style>:root{--bg:#e9e5db;--paper:#f3efe6;--ink:#151515;--muted:#746e63;--line:#c8bfae;--gold:#d9c795;--red:#9d3d34;--green:#2c5d55}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif}
.wrap{max-width:1180px;margin:0 auto;background:#f8f4ec;border:1px solid #cfc7b8;padding:14px;box-shadow:0 16px 40px rgba(43,36,24,.14)}
.slide{display:block;width:100%;height:auto;background:var(--paper);border:1px solid #cfc7b8}
.headerLeft{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:18px;font-weight:850;fill:#151515;letter-spacing:.10em}
.headerRight{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:17px;font-weight:750;fill:#8a857b;letter-spacing:.10em}
.lead{font-size:25px;font-weight:600;fill:#26231f}
.colTitle{font-size:32px;font-weight:900;fill:#151515;letter-spacing:-.035em}
.colSub{font-size:19px;font-weight:650;fill:#746e63;letter-spacing:-.02em}
.slotLabel{font-size:30px;font-weight:900;fill:#81776a;letter-spacing:-.02em;text-anchor:middle}
.slotSub{font-size:18px;font-weight:650;fill:#9a9084;text-anchor:middle}
.no{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:18px;font-weight:900;fill:#9d3d34}
</style></head>
<body><div class="wrap">
<svg class="slide" viewBox="0 0 1600 900" role="img" aria-label="Three Columns Equal">
<defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="12" stroke="#d9d1c3" stroke-width="1" opacity=".50"/>
</pattern>
</defs>
<rect width="1600" height="900" fill="#f3efe6"/>
<text x="80" y="72" class="headerLeft">04 ／ 構成整理</text>
<text x="1520" y="72" class="headerRight" text-anchor="end">20 / 20</text>
<line x1="80" y1="100" x2="1520" y2="100" stroke="#bdb4a5" stroke-width="1"/>
<foreignObject x="80" y="128" width="1440" height="92">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Yu Gothic UI','Yu Gothic','Noto Sans JP',sans-serif;font-size:64px;font-weight:900;letter-spacing:-0.055em;line-height:1.05;color:#151515;white-space:nowrap;">
    <span style="display:inline;background:linear-gradient(to bottom, transparent 54%, rgba(217,199,149,.86) 54%, rgba(217,199,149,.86) 88%, transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;">3つの責務を同列で整理</span>
  </div>
</foreignObject>
<text x="80" y="265" class="lead">検索と取引と署名を同じ階層で並べて責務の違いを確認する。</text>
<rect x="80" y="315" width="460" height="505" fill="rgba(255,255,255,.18)" stroke="#c8bfae" stroke-width="1.6"/><text x="108" y="362" class="no">01</text><text x="108" y="420" class="colTitle">Discovery</text><text x="108" y="465" class="colSub">利用可能な候補を見つける</text><rect x="108" y="510" width="404" height="250" fill="url(#hatch)" stroke="#d8d0c2" stroke-width="1.2" stroke-dasharray="8 7"/><text x="310" y="625" class="slotLabel">Discovery</text><text x="310" y="660" class="slotSub">図または説明</text><rect x="570" y="315" width="460" height="505" fill="rgba(255,255,255,.18)" stroke="#c8bfae" stroke-width="1.6"/><text x="598" y="362" class="no">02</text><text x="598" y="420" class="colTitle">Transaction</text><text x="598" y="465" class="colSub">条件を合意して取引を作る</text><rect x="598" y="510" width="404" height="250" fill="url(#hatch)" stroke="#d8d0c2" stroke-width="1.2" stroke-dasharray="8 7"/><text x="800" y="625" class="slotLabel">Transaction</text><text x="800" y="660" class="slotSub">図または説明</text><rect x="1060" y="315" width="460" height="505" fill="rgba(255,255,255,.18)" stroke="#c8bfae" stroke-width="1.6"/><text x="1088" y="362" class="no">03</text><text x="1088" y="420" class="colTitle">Signing</text><text x="1088" y="465" class="colSub">署名権限を安全に扱う</text><rect x="1088" y="510" width="404" height="250" fill="url(#hatch)" stroke="#d8d0c2" stroke-width="1.2" stroke-dasharray="8 7"/><text x="1290" y="625" class="slotLabel">Signing</text><text x="1290" y="660" class="slotSub">図または説明</text>
</svg></div></body></html>
